<!doctype html>
<!-- Profile banner source. Render: banner_src/render_banner.sh -> assets/banner.png (3168x792) -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1584px;height:396px;background:#111a2e;overflow:hidden}
  svg{position:absolute;inset:0}
  .txt{position:absolute;left:500px;top:52px;color:#e8edf5;font-family:'Space Grotesk',sans-serif}
  h1{margin:0;font-size:58px;font-weight:700;letter-spacing:-0.5px}
  .sub{margin-top:8px;font-size:25px;color:#6fd3c1;font-weight:500}
  .rule{margin-top:34px;width:1000px;height:1px;background:#2a3650}
  .cols{display:flex;gap:0;margin-top:24px}
  .col{width:340px}
  .lab{font-family:'Space Mono',monospace;font-size:14px;letter-spacing:3px;color:#6fd3c1;opacity:.85}
  .val{margin-top:10px;font-size:20px;font-weight:500}
  .tag{margin-top:34px;font-size:17px;color:#8b97ad}
</style></head><body>
<svg width="1584" height="396" id="helix"></svg>
<div class="txt">
  <h1>Joanna Hughes</h1>
  <div class="sub">Software Engineer · Backend, Cloud &amp; Genomics Data</div>
  <div class="rule"></div>
  <div class="cols">
    <div class="col"><div class="lab">BACKEND</div><div class="val">Java · Spring Boot · SQL</div></div>
    <div class="col"><div class="lab">CLOUD &amp; DEVOPS</div><div class="val">AWS · Terraform · Docker</div></div>
    <div class="col"><div class="lab">DATA PIPELINES</div><div class="val">Python · Nextflow</div></div>
  </div>
  <div class="tag">Building backend services and cloud infrastructure for data-heavy science</div>
</div>
<script>
// Two DNA strands (sine waves half a period apart) with dots, fading under the text
const W=1584,H=396,mid=H/2,amp=118,period=470,ns="http://www.w3.org/2000/svg";
const svg=document.getElementById('helix');
svg.innerHTML=`<defs><linearGradient id="fade" x1="0" x2="1">
 <stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".26" stop-color="#fff" stop-opacity=".9"/>
 <stop offset=".42" stop-color="#fff" stop-opacity=".18"/><stop offset=".8" stop-color="#fff" stop-opacity=".18"/>
 <stop offset="1" stop-color="#fff" stop-opacity=".75"/></linearGradient>
 <mask id="m"><rect width="${W}" height="${H}" fill="url(#fade)"/></mask></defs><g id="g" mask="url(#m)"></g>`;
const g=svg.querySelector('#g');
const y=(x,ph)=>mid+amp*Math.sin(2*Math.PI*x/period+ph);
[[0,'#b39cf5'],[Math.PI,'#6fd3c1']].forEach(([ph,col])=>{
  let d='';for(let x=-10;x<=W+10;x+=4)d+=(d?'L':'M')+x+' '+y(x,ph).toFixed(1);
  const p=document.createElementNS(ns,'path');p.setAttribute('d',d);p.setAttribute('fill','none');
  p.setAttribute('stroke',col);p.setAttribute('stroke-width','2');p.setAttribute('opacity','.6');g.appendChild(p);
  for(let x=0;x<=W;x+=period/12){const c=document.createElementNS(ns,'circle');
    c.setAttribute('cx',x);c.setAttribute('cy',y(x,ph));c.setAttribute('r',4.5);
    c.setAttribute('fill','#111a2e');c.setAttribute('stroke',col);c.setAttribute('stroke-width','2');g.appendChild(c);}
});
// faint horizon line through the crossings
const l=document.createElementNS(ns,'line');l.setAttribute('x1',0);l.setAttribute('x2',W);
l.setAttribute('y1',mid);l.setAttribute('y2',mid);l.setAttribute('stroke','#2a3650');l.setAttribute('stroke-width','1.5');g.prepend(l);
</script></body></html>
